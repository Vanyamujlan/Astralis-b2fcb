[project]
name = "astralio"
version = "0.1.0"
description = "Astralio Telegram Bot MVP — Astrology, Compatibility, Transit Forecasts & Tarot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.0,<23.0",
    "firebase-admin>=6.6.0,<8.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "pyswisseph>=2.10.3.2",
    "httpx>=0.28.0,<1.0.0",
    "timezonefinder>=6.5.0,<10.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["astralio", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["astralio", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --tb=short"
filterwarnings = [
    "ignore:If 'per_message=False', 'CallbackQueryHandler' will not be tracked for every message:telegram.warnings.PTBUserWarning",
]
